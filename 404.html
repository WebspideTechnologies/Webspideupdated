<!DOCTYPE html>
<html lang="en">
<head>
<script>
/* Universal Clean URL handler: removes .html and index.html from address bar without reloading */
(function(){
  if (typeof window !== 'undefined' && window.location && window.location.protocol.startsWith('http')) {
    var p = window.location.pathname;
    var s = window.location.search || '';
    var h = window.location.hash || '';
    if (p.endsWith('/index.html') || p.endsWith('/index')) {
      var c = p.replace(/\/index(\.html)?$/, '/');
      window.history.replaceState(null, '', c + s + h);
    } else if (p.endsWith('/blog.html')) {
      var c = p.replace(/\/blog\.html$/, '/blog/');
      window.history.replaceState(null, '', c + s + h);
    } else if (p.endsWith('.html')) {
      var c = p.replace(/\.html$/, '');
      window.history.replaceState(null, '', c + s + h);
    }
  }
  if (typeof window !== 'undefined' && window.location && window.location.protocol === 'file:') {
    document.addEventListener('click', function(e) {
      var a = e.target.closest && e.target.closest('a');
      if (!a) return;
      var href = a.getAttribute('href');
      if (!href || href.startsWith('http') || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:') || href.includes('.html')) return;
      if (href === '' || href === '/' || href === './') {
        a.setAttribute('href', 'index.html');
      } else if (href === 'blog' || href === 'blog/' || href === './blog/' || href === './blog') {
        a.setAttribute('href', 'blog.html');
      } else if (!href.includes('.')) {
        a.setAttribute('href', href.replace(/\/$/, '') + '.html');
      }
    }, true);
  }
})();
</script>
  <meta charset="UTF-8">
  <title>Page Not Found | Webspide Technologies</title>
  <script>
    // GitHub Pages SPA router for /blog/<slug>/
    (function() {
      var path = window.location.pathname;
      var blogMatch = path.match(/\/blog\/([^\/]+)\/?$/i);
      if (blogMatch && blogMatch[1]) {
        var slug = decodeURIComponent(blogMatch[1]);
        var repoPrefix = path.substring(0, path.indexOf('/blog/'));
        window.location.replace(repoPrefix + '/blog-detail.html?title=' + encodeURIComponent(slug));
        return;
      }
    })();
  </script>
  <meta http-equiv="refresh" content="4; url=blog/">
